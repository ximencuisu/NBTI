<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBTI 人格测试</title>
  <meta name="description" content="修仙之路千万条，测测你走的是哪一条？基于玄幻世界人格引擎的十五维修仙人格测试。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <!-- 首页 -->
    <section id="page-intro" class="page active">
      <div class="card intro-card">
        <h1 class="intro-title">NBTI</h1>
        <p class="intro-subtitle">修仙之路千万条，你走的是哪一条？</p>
        <div class="intro-divider"></div>
        <p style="font-size:0.9rem;color:var(--ink-light);margin-bottom:28px;line-height:1.8;">
          三十道天命抉择<br/>
          探你胆识谋略，测你善恶执念<br/>
          看看你的本命道心，究竟与哪位传奇人物同源
        </p>
        <button id="btn-start" class="btn btn-primary">开始测试</button>
        <p class="intro-credit">NBTI 修仙人格测试 · 仅供娱乐</p>
      </div>
    </section>

    <!-- 答题页 -->
    <section id="page-quiz" class="page">
      <div class="card quiz-card">
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-info">
          <span class="cultivation-stage" id="cultivation-stage">【练气期】初入修道</span>
          <span id="progress-text">0 / 30</span>
        </div>
        <div class="question-area">
          <div class="question-module" id="question-module">— 处世之道 —</div>
          <p class="question-text" id="question-text"></p>
        </div>
        <div class="options" id="options"></div>
      </div>
    </section>

    <!-- 结果页 -->
    <section id="page-result" class="page">
      <div class="card result-card" id="result-card">
        <div class="result-kicker" id="result-kicker">你的主类型</div>
        <div class="result-name" id="result-name"></div>
        <div class="result-source" id="result-source"></div>
        <div class="result-badge" id="result-badge"></div>

        <div class="result-keywords" id="result-keywords"></div>

        <div class="result-quote" id="result-quote"></div>
        <div class="result-quote-context" id="result-quote-context"></div>

        <div class="result-bio" id="result-bio"></div>

        <div class="result-tags" id="result-tags" style="display:none"></div>
        <div class="result-special-badge" id="result-special-badge" style="display:none"></div>

        <div class="result-secondary" id="result-secondary" style="display:none">
          <div class="secondary-info" id="secondary-info"></div>
        </div>

        <h3 class="section-title">✦ 天命十五维 ✦</h3>
        <canvas id="radar-chart" width="320" height="320"></canvas>
        <div class="dimensions-detail" id="dimensions-detail"></div>

        <div class="result-top3">
          <h3 class="section-title">命轮轨迹 TOP 5</h3>
          <div id="top-list"></div>
        </div>

        <div class="disclaimer" id="disclaimer"></div>

        <div class="result-actions">
          <button id="btn-download" class="btn btn-primary">保存分享图</button>
          <button id="btn-restart" class="btn btn-secondary">重新测试</button>
        </div>
      </div>
    </section>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
