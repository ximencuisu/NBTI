<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBTI 人格测试</title>
  <meta name="description" content="修仙之路千万条，测测你走的是哪一条？基于玄幻世界人格引擎的十五维修仙人格测试。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>" />
  <style>@import"https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Ma+Shan+Zheng&display=swap";:root{--ink-black:#1a1a2e;--ink-gold:#c9a84c;--ink-red:#a83232;--ink-gray:#8b8b8b;--ink-light:#5a5a5a;--bg-paper:#f5f0e8;--bg-dark:#0f0f1a;--card-bg:#fff;--text:#1a1a2e;--text-secondary:#5a5a5a;--accent:#c9a84c;--accent-light:#f5f0e8;--accent-hover:#b89430;--border:#e0d8c8;--radius:12px;--shadow:0 4px 20px rgba(26,26,46,.08);--font:"PingFang SC","Microsoft YaHei","Noto Serif SC",serif;--font-title:"Ma Shan Zheng","Noto Serif SC",serif;--max-width:640px}*,:before,:after{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--font);background:var(--bg-paper);color:var(--text);line-height:1.7;min-height:100dvh}#app{max-width:var(--max-width);margin:0 auto;padding:16px;min-height:100dvh;display:flex;align-items:center;justify-content:center}.page{display:none;width:100%}.page.active{display:block;animation:fadeIn .4s ease}@keyframes fadeIn{0%{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.card{background:var(--card-bg);border-radius:var(--radius);padding:32px 24px;box-shadow:var(--shadow);border:1px solid var(--border)}.intro-card{text-align:center;padding:56px 24px;position:relative;overflow:hidden}.intro-card:before{content:"✦";position:absolute;top:20px;left:50%;transform:translate(-50%);font-size:1.2rem;color:var(--ink-gold);opacity:.5}.intro-title{font-family:var(--font-title);font-size:3rem;font-weight:400;line-height:1.2;margin-bottom:8px;color:var(--ink-black);letter-spacing:.1em}.intro-subtitle{font-size:1rem;color:var(--ink-gray);margin-bottom:40px;font-style:italic}.intro-divider{width:60px;height:1px;background:var(--ink-gold);margin:0 auto 32px;opacity:.5}.intro-credit{margin-top:20px;font-size:.8rem;color:var(--ink-gray)}.btn{display:inline-block;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;transition:all .25s;font-family:var(--font)}.btn-primary{background:var(--ink-black);color:var(--ink-gold);padding:14px 48px;letter-spacing:.08em}.btn-primary:hover{background:#2a2a44;transform:translateY(-2px);box-shadow:0 4px 12px rgba(26,26,46,.2)}.btn-primary:active{transform:translateY(0)}.btn-secondary{background:var(--accent-light);color:var(--ink-black);padding:12px 36px;border:1px solid var(--border)}.btn-secondary:hover{background:var(--border)}.btn-option{display:block;width:100%;text-align:left;padding:14px 18px;margin-bottom:10px;background:var(--card-bg);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-size:.92rem;font-weight:400;line-height:1.6;letter-spacing:.02em}.btn-option:hover{border-color:var(--ink-gold);background:var(--accent-light)}.btn-option:active{background:var(--ink-black);color:var(--ink-gold);border-color:var(--ink-black)}.quiz-card{padding:24px 20px}.progress-bar{height:4px;background:var(--accent-light);border-radius:2px;overflow:hidden;margin-bottom:6px}.progress-fill{height:100%;background:linear-gradient(90deg,var(--ink-gold),var(--ink-red));border-radius:2px;transition:width .4s ease;width:0%}.progress-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;font-size:.8rem;color:var(--ink-gray)}.cultivation-stage{color:var(--ink-gold);font-weight:600;font-size:.82rem}.question-area{margin-bottom:24px}.question-module{font-size:.75rem;color:var(--ink-gray);letter-spacing:.15em;text-transform:uppercase;margin-bottom:8px}.question-text{font-size:1.05rem;font-weight:500;line-height:1.8;color:var(--text)}.result-card{text-align:center;padding:32px 20px}.result-kicker{font-size:.85rem;color:var(--ink-gray);margin-bottom:6px;letter-spacing:.1em}.result-name{font-family:var(--font-title);font-size:2.4rem;font-weight:400;color:var(--ink-black);margin-bottom:4px;letter-spacing:.05em}.result-source{font-size:.85rem;color:var(--ink-gray);margin-bottom:12px}.result-badge{display:inline-block;background:var(--accent-light);color:var(--ink-gray);padding:6px 16px;border-radius:20px;font-size:.8rem;font-weight:500;margin-bottom:12px}.result-keywords{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-bottom:16px}.keyword-tag{background:var(--accent-light);color:var(--ink-light);padding:3px 12px;border-radius:12px;font-size:.78rem;border:1px solid var(--border)}.result-quote{font-style:italic;font-size:1rem;color:var(--ink-red);margin-bottom:4px;line-height:1.6}.result-quote-context{font-size:.8rem;color:var(--ink-gray);margin-bottom:16px}.result-bio{font-size:.9rem;color:var(--text-secondary);text-align:left;line-height:1.8;margin-bottom:16px;padding:12px 16px;background:var(--accent-light);border-radius:8px;border-left:3px solid var(--ink-gold)}.result-tags{font-size:.8rem;color:var(--ink-gold);font-family:monospace;margin-bottom:16px;letter-spacing:.05em}.result-special-badge{font-size:.78rem;color:var(--ink-red);background:#fef0f0;padding:6px 12px;border-radius:6px;margin-bottom:16px}.result-secondary{background:var(--accent-light);padding:12px 16px;border-radius:8px;margin-bottom:24px}.secondary-info{font-size:.9rem;color:var(--ink-light);font-weight:600}.section-title{font-size:1rem;font-weight:700;color:var(--text);margin:28px 0 16px;text-align:center;letter-spacing:.05em}#radar-chart{display:block;margin:0 auto 24px;max-width:100%}.dimensions-detail{text-align:left;margin-bottom:24px}.dim-row{padding:12px 0;border-bottom:1px solid var(--border)}.dim-row:last-child{border-bottom:none}.dim-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}.dim-name{font-size:.9rem;font-weight:600;color:var(--text)}.dim-level{font-size:.75rem;font-weight:600;padding:2px 10px;border-radius:10px;white-space:nowrap}.level-low{background:#f5f0e8;color:var(--ink-gray)}.level-mid{background:#f5f0e8;color:var(--ink-gold)}.level-high{background:#fef0f0;color:var(--ink-red)}.dim-desc{font-size:.8rem;color:var(--ink-gray);line-height:1.5}.top-item{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)}.top-item:last-child{border-bottom:none}.top-rank{font-size:.8rem;font-weight:700;color:var(--ink-gray);min-width:28px}.top-code{font-size:.85rem;font-weight:600;color:var(--ink-black);flex:1;text-align:left}.top-sim{font-size:.8rem;font-weight:600;color:var(--ink-gold)}.top-dist{font-size:.75rem;color:var(--ink-gray)}.disclaimer{margin-top:24px;padding:16px;background:var(--accent-light);border-radius:8px;font-size:.78rem;color:var(--ink-gray);line-height:1.5;text-align:center}.result-actions{margin-top:24px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}@media(max-width:480px){.intro-title{font-size:2rem}.result-name{font-size:1.8rem}.card{padding:24px 16px}}</style>
</head>
<body>
  <div id="app">
    <section id="page-intro" class="page active">
      <div class="card intro-card">
        <h1 class="intro-title">NBTI</h1>
        <p class="intro-subtitle">修仙之路千万条，你走的是哪一条？</p>
        <div class="intro-divider"></div>
        <p style="font-size:0.9rem;color:var(--ink-light);margin-bottom:28px;line-height:1.8;">
          三十道天命抉择<br/>
          探你胆识谋略，测你善恶执念<br/>
          看看你的本命道心，究竟与哪位传奇人物同源
        </p>
        <button id="btn-start" class="btn btn-primary">开始测试</button>
        <p class="intro-credit">NBTI 修仙人格测试 · 仅供娱乐</p>
      </div>
    </section>

    <section id="page-quiz" class="page">
      <div class="card quiz-card">
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-info">
          <span class="cultivation-stage" id="cultivation-stage">【练气期】初入修道</span>
          <span id="progress-text">0 / 30</span>
        </div>
        <div class="question-area">
          <div class="question-module" id="question-module">— 处世之道 —</div>
          <p class="question-text" id="question-text"></p>
        </div>
        <div class="options" id="options"></div>
      </div>
    </section>

    <section id="page-result" class="page">
      <div class="card result-card" id="result-card">
        <div class="result-kicker" id="result-kicker">你的主类型</div>
        <div class="result-name" id="result-name"></div>
        <div class="result-source" id="result-source"></div>
        <div class="result-badge" id="result-badge"></div>

        <div class="result-keywords" id="result-keywords"></div>

        <div class="result-quote" id="result-quote"></div>
        <div class="result-quote-context" id="result-quote-context"></div>

        <div class="result-bio" id="result-bio"></div>

        <div class="result-tags" id="result-tags" style="display:none"></div>
        <div class="result-special-badge" id="result-special-badge" style="display:none"></div>

        <div class="result-secondary" id="result-secondary" style="display:none">
          <div class="secondary-info" id="secondary-info"></div>
        </div>

        <h3 class="section-title">✦ 天命十五维 ✦</h3>
        <canvas id="radar-chart" width="320" height="320"></canvas>
        <div class="dimensions-detail" id="dimensions-detail"></div>

        <div class="result-top3">
          <h3 class="section-title">命轮轨迹 TOP 5</h3>
          <div id="top-list"></div>
        </div>

        <div class="disclaimer" id="disclaimer"></div>

        <div class="result-actions">
          <button id="btn-download" class="btn btn-primary">保存分享图</button>
          <button id="btn-restart" class="btn btn-secondary">重新测试</button>
        </div>
      </div>
    </section>
  </div>

  <script src="bundle.js"></script>
</body>
</html>
